services:
  rails-app:
    environment:
      NIX_CONFIG: "experimental-features = nix-command flakes"
      NIX_REMOTE: local
      XDG_RUNTIME_DIR: /run/user/1000
      DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/1000/bus
      PATH: /home/lyssna/.nix-profile/bin:/nix/var/nix/profiles/devcontainer/bin:/home/lyssna/.local/share/mise/shims:/home/lyssna/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - ${HOME}/dotfiles:/home/lyssna/dotfiles:cached
      - pi-agent:/home/lyssna/.pi/agent
      # Credentials are live-shared; sibling locks remain container-local.
      - type: bind
        source: ${HOME}/.pi/agent/auth.json
        target: /home/lyssna/.pi/agent/auth.json
        bind:
          create_host_path: false
      - type: bind
        source: ${HOME}/.pi/agent/mcp-auth.json
        target: /home/lyssna/.pi/agent/mcp-auth.json
        bind:
          create_host_path: false
      - ${HOME}/.pi/agent/sessions:/home/lyssna/.pi/agent/sessions
      # Launch Pi from the host path so session grouping matches outside the container.
      - ../:${HOST_WORKTREE_PATH}:cached
      - node-modules:${HOST_WORKTREE_PATH}/node_modules
      - nix:/nix
      - mise-data:/home/lyssna/.local/share/mise
      # All consumers share one daemon because concurrent GNOME Keyring writers are unsafe.
      - lyssna-keyring-runtime:/run/user/1000:ro

volumes:
  pi-agent:
    external: true
  nix:
    external: true
  mise-data:
    external: true
  lyssna-keyring-data:
    external: true
  lyssna-keyring-runtime:
    external: true
